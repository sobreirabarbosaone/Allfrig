<!DOCTYPE html>
<html lang="pt-br"> <!-- -->
	<head> <!-- -->
		<meta charset="UTF-8" /> <!-- -->
		<meta name="viewport"/> <!-- -->
		<title>Elix</title> <!-- -->
		<link rel="icon" type="x-icon" href="imagens/logo.ico"> <!-- -->
		<link rel="stylesheet" href="css/style.css"> <!-- -->
		 <script src="js/script.js" defer></script> <!-- -->
	</head>
	<body> <!-- -->
		<header> <!-- -->
			<nav class="logo"> <!-- -->
				<img src="imagens/logo+Elix.png" alt="Logo da Empresa" /> <!-- -->
			</nav>
		</header>

		<div class="login-container"> <!-- -->
			<h2>Login -  All Frig</h2> <!-- -->
			<select id="userType"> <!-- -->
				<option value="">Perfil de Acesso</option> <!-- -->
				<option value="geral">Administrativo</option>
				<option value="fornecedor">Fornecedor</option>
				<option value="supervisor">Supervisor</option>
				<option value="vendedor">Vendedor</option>
			</select>
			<input type="text" id="username" placeholder="Usuário"/> <!-- -->
			<input type="password" id="password" placeholder="Senha"/> <!-- -->
			<button onclick="verifyLogin()">Entrar</button> <!-- -->
			<p class="error-message" id="error-message">Mensagem de erro aqui</p> <!-- -->
		</div>
	</body>
</html>
